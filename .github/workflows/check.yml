name: Check Migri Oulu appointments

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_IDS: ${{ secrets.ALERT_CHAT_IDS }}
          SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: migri-state
          path: state.json
          if-no-files-found: ignore
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'Update runner status'
          file_pattern: state.json
